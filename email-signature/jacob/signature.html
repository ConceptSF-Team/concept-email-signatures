<!--
  Jacob Beau — Concept email signature
  Paste the markup between <table>...</table> into your email client's
  HTML signature field. Edit the phone number / links as needed.
-->
<table cellpadding="0" cellspacing="0" border="0" role="presentation"
       style="font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color:#111; font-size:12px; line-height:1.4;">
  <tr>
    <!-- Left: Concept logo -->
    <td valign="top" style="padding-right:18px; border-right:1px solid #e5e5e5;">
      <a href="https://conceptsf.com" style="text-decoration:none; border:0;">
        <img src="https://assets.conceptsf.com/email-signature/jacob/concept-logo.gif"
             alt="Concept"
             width="120" height="37"
             style="display:block; border:0; outline:none; text-decoration:none;">
      </a>
    </td>

    <!-- Right: name, title chip, contact rows -->
    <td valign="top" style="padding-left:18px;">
      <!-- Name -->
      <div style="margin:0 0 6px 0;">
        <img src="https://assets.conceptsf.com/email-signature/jacob/name.png"
             alt="Jacob Beau"
             width="132" height="25"
             style="display:block; border:0; outline:none; text-decoration:none;">
      </div>

      <!-- Title chip -->
      <div style="margin:0 0 10px 0;">
        <img src="https://assets.conceptsf.com/email-signature/jacob/chip.png"
             alt="Chief Executive Officer"
             width="135" height="14"
             style="display:block; border:0; outline:none; text-decoration:none;">
      </div>

      <!-- Phone -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin:0 0 4px 0;">
        <tr>
          <td valign="middle" style="padding-right:8px;">
            <img src="https://assets.conceptsf.com/email-signature/jacob/phone.png"
                 alt="" width="14" height="14"
                 style="display:block; border:0; outline:none;">
          </td>
          <td valign="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; font-size:12px; color:#111;">
            <a href="tel:+15555555555" style="color:#111; text-decoration:none;">+1 (555) 555-5555</a>
          </td>
        </tr>
      </table>

      <!-- Web -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin:0 0 4px 0;">
        <tr>
          <td valign="middle" style="padding-right:8px;">
            <img src="https://assets.conceptsf.com/email-signature/jacob/web.png"
                 alt="" width="14" height="14"
                 style="display:block; border:0; outline:none;">
          </td>
          <td valign="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; font-size:12px; color:#111;">
            <a href="https://conceptsf.com" style="color:#111; text-decoration:none;">conceptsf.com</a>
          </td>
        </tr>
      </table>

      <!-- Email -->
      <div style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; font-size:12px; color:#111;">
        <a href="mailto:executive@conceptsf.com" style="color:#111; text-decoration:none;">executive@conceptsf.com</a>
      </div>
    </td>
  </tr>
</table>
